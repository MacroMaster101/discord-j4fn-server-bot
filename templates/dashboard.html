<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>J4FN | Server Dashboard</title>
    <link rel="icon" href="{{ asset('favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ asset('css/admin.css') }}">
</head>
<body>

    <!-- Shown until /api/me says who this is -->
    <div id="signInGate" class="signin-gate">
        <div class="signin-card">
            <img src="{{ asset('logo.png') }}" alt="" class="signin-logo">
            <h1>Server Dashboard</h1>
            <p id="signInBlurb">
                Sign in with Discord to manage the servers you run.
            </p>
            <a id="signInBtn" class="btn btn-primary" href="/auth/discord">
                <i class="fa-brands fa-discord"></i> Sign in with Discord
            </a>
            <p id="signInError" class="signin-error"></p>
            <a href="/" class="signin-back">&larr; Back to the public page</a>
        </div>
    </div>

    <nav class="admin-nav" id="dashNav" hidden>
        <div class="brand-box">
            <img src="{{ asset('logo.png') }}" alt="J4FN Logo">
            <div class="brand-title">
                <h1>J4FN DASHBOARD</h1>
                <p>Server administration</p>
            </div>
        </div>
        <div class="nav-actions">
            <select id="guildPicker" class="form-control guild-picker"></select>
            <span id="whoami" class="whoami"></span>
            <a class="btn btn-primary" href="/auth/logout">
                <i class="fa-solid fa-right-from-bracket"></i> Sign out
            </a>
        </div>
    </nav>

    <main class="admin-main" id="dashMain" hidden>

        <div class="grid-2-col">

            <!-- Anti-spam, scoped to the selected guild -->
            <div class="panel-box">
                <div class="panel-head">
                    <h3><i class="fa-solid fa-shield-virus" style="color: var(--color-emerald)"></i> Anti-Spam Filter</h3>
                    <label class="automod-switch">
                        <input type="checkbox" id="dEnabled">
                        <span id="dEnabledLabel">Enabled</span>
                    </label>
                </div>

                <form id="dForm" onsubmit="saveGuildAutomod(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="dThreshold">Scam Score Threshold</label>
                            <input type="number" id="dThreshold" class="form-control" min="1" max="20">
                            <small class="form-hint">Lower is stricter.</small>
                        </div>
                        <div class="form-group">
                            <label for="dAction">First Scam Hit</label>
                            <select id="dAction" class="form-control">
                                <option value="warn">⚠️ Delete &amp; warn only</option>
                                <option value="timeout">⏳ Delete &amp; timeout</option>
                                <option value="ban">🔨 Delete &amp; ban</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dTimeout">Timeout (minutes)</label>
                            <input type="number" id="dTimeout" class="form-control" min="1" max="10080">
                        </div>
                        <div class="form-group">
                            <label for="dRate">Flood Limit (messages)</label>
                            <input type="number" id="dRate" class="form-control" min="2" max="30">
                        </div>
                        <div class="form-group full">
                            <label for="dBlockDomains">Blocked Domains</label>
                            <input type="text" id="dBlockDomains" class="form-control" placeholder="badsite.com, another.vip">
                        </div>
                        <div class="form-group full">
                            <label for="dKeywords">Extra Blocked Phrases</label>
                            <input type="text" id="dKeywords" class="form-control" placeholder="free vbucks, dm for carry">
                        </div>
                    </div>

                    <div class="automod-signals">
                        <span class="automod-signals-label">Signal categories</span>
                        <div id="dSignals" class="automod-toggles"></div>
                    </div>

                    <div class="automod-toggles">
                        <label><input type="checkbox" id="dInvites"> Block invite links</label>
                        <label><input type="checkbox" id="dMentions"> Block mass mentions</label>
                        <label><input type="checkbox" id="dImages"> Detect repeated images</label>
                        <label><input type="checkbox" id="dBanRepeat"> Ban on repeat offence</label>
                    </div>

                    <div class="dash-actions">
                        <button type="button" class="btn-unblock" onclick="resetGuildAutomod()">Reset to defaults</button>
                        <button type="submit" class="btn btn-purple"><i class="fa-solid fa-floppy-disk"></i> Save</button>
                    </div>
                </form>
            </div>

            <!-- Activity + blocked images -->
            <div class="panel-box">
                <div class="panel-head">
                    <h3><i class="fa-solid fa-radar"></i> Activity</h3>
                    <span id="dOverrideCount" class="override-count"></span>
                </div>

                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="dTestText">Test a message</label>
                    <div style="display: flex; gap: 8px;">
                        <input type="text" id="dTestText" class="form-control" placeholder="Paste a suspicious message...">
                        <button type="button" class="btn btn-primary" onclick="testGuildMessage()"><i class="fa-solid fa-flask"></i></button>
                    </div>
                    <div id="dTestResult" style="margin-top: 10px; font-size: 0.82rem;"></div>
                </div>

                <div id="dRecent" class="dash-list"></div>

                <div class="automod-signals" style="margin-top: 16px;">
                    <span class="automod-signals-label">Blocked Images</span>
                    <div id="dBlocked" class="dash-list"></div>
                </div>
            </div>

        </div>

        <div class="grid-2-col">
            <div class="panel-box">
                <div class="panel-head">
                    <h3><i class="fa-solid fa-list-check"></i> Member Warnings</h3>
                </div>
                <div id="dWarnings" class="dash-list"></div>
            </div>

            <div class="panel-box">
                <div class="panel-head">
                    <h3><i class="fa-solid fa-gavel"></i> Moderation</h3>
                </div>
                <form id="dModForm" onsubmit="runGuildModAction(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="dModAction">Action</label>
                            <select id="dModAction" class="form-control" required>
                                <option value="warn">⚠️ Issue Warning</option>
                                <option value="timeout">⏳ Timeout</option>
                                <option value="kick">👢 Kick</option>
                                <option value="ban">🔨 Ban</option>
                                <option value="unban">🔓 Unban</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="dModUser">User ID</label>
                            <input type="text" id="dModUser" class="form-control" placeholder="123456789012345678" required>
                        </div>
                        <div class="form-group full">
                            <label for="dModReason">Reason / Duration</label>
                            <input type="text" id="dModReason" class="form-control" placeholder="Reason...">
                        </div>
                    </div>
                    <div class="dash-actions">
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-gavel"></i> Execute</button>
                    </div>
                </form>
            </div>
        </div>

    </main>

    <script src="{{ asset('js/dashboard.js') }}"></script>
</body>
</html>
