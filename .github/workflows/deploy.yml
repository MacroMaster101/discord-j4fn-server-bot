name: Deploy Bot to Oracle Cloud

# main is the production branch: anything landing here ships. Reaching it should
# only ever happen through a reviewed PR from dev.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        # No --no-cache-dir here: setup-python's `cache: pip` saves
        # ~/.cache/pip afterwards and fails the job if nothing wrote it.
        run: pip install -r requirements.txt

      - name: Auto-mod detection checks
        run: python test_automod.py

      - name: Authorization boundary checks
        env:
          DISCORD_TOKEN: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
          COOKIE_SECURE: '0'
        run: python test_auth.py

      - name: Bot imports cleanly
        env:
          DISCORD_TOKEN: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
        run: python -c "import bot"

  deploy:
    name: Deploy
    needs: test          # a red test run must never reach the server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        # Pinned to a commit, not the tag: a tag can be moved, and this step
        # receives the production SSH key, so a compromised release would hand
        # over the whole host. Dependabot proposes the bumps.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          # EC2_* secret names are carried over from the old AWS host; they now
          # hold the Oracle Cloud instance's address, user and SSH key.
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/discord-j4fn-server-bot
            git pull origin main
            # --pull so a digest bump in the Dockerfile or compose file is
            # actually fetched; without it Docker reuses whatever is in the
            # host's local image store and the pin never takes effect.
            docker compose build --pull
            docker compose up -d
            docker image prune -f
