name: Deploy Bot to AWS EC2

# main is the production branch: anything landing here ships. Reaching it should
# only ever happen through a reviewed PR from dev.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Auto-mod detection checks
        run: python test_automod.py

      - name: Bot imports cleanly
        env:
          DISCORD_TOKEN: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
        run: python -c "import bot"

  deploy:
    name: Deploy
    needs: test          # a red test run must never reach the server
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/discord-j4fn-server-bot
            git pull origin main
            docker compose up -d --build
            docker image prune -f
