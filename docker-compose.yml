version: '3.8'

services:
  bot:
    build: .
    container_name: discord-j4fn-bot
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PORT=8080

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-j4fn-bot
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - bot

