services:
  bot:
    build: .
    container_name: discord-j4fn-bot
    restart: unless-stopped
    ports:
      # cloudflared reaches the bot as bot:8080 over the compose network; set
      # DASHBOARD_BIND_ADDRESS=127.0.0.1 to keep the origin off the public internet.
      - "${DASHBOARD_BIND_ADDRESS:-0.0.0.0}:8080:8080"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    environment:
      - PORT=8080

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-j4fn-bot
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - bot

